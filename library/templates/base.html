{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>

    body{
    background:#f4f7fb;
    font-family:'Vazirmatn', sans-serif;
     }   

    .navbar{
        background:linear-gradient(90deg,#0f172a,#2563eb);
        padding:15px 0;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
    }

    .navbar-brand{
        color:white!important;
        font-size:28px;
        font-weight:bold;
    }

    .add-btn{
        background:#22c55e;
        color:white;
        border-radius:10px;
        padding:10px 20px;
        text-decoration:none;
        transition:.3s;
    }

    .add-btn:hover{
        background:#16a34a;
        color:white;
    }
    .card{
    border:none;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.card-title{
    color:#0d6efd;
    font-weight:bold;
}

.card-footer{
    background:white;
    border:none;
}

.btn-warning{
    color:white;
}

.btn{
    border-radius:10px;
}
body{
    background:#f4f7fc;
}

.card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    transition:0.3s;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,0.18);
}

.card-body{
    padding:25px;
}

.card-title{
    font-weight:bold;
    color:#0d6efd;
}

.card-footer{
    background:#fff;
    border-top:1px solid #eee;
    padding:15px;
}

.btn{
    border-radius:30px;
    font-weight:bold;
}

.btn-warning{
    color:white;
}

input.form-control{
    border-radius:30px;
}

.input-group .btn{
    border-radius:30px;
}

.nav-link{
    color:#fff !important;
    font-weight:600;
    transition:0.3s;
}

.nav-link:hover{
    color:#ffd54f !important;
}

.navbar .btn{
    margin-right:8px;
    border-radius:12px;
}

.navbar-text{
    color:white !important;
    font-weight:600;
}

.navbar{
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar-brand{
    letter-spacing: .5px;
}

.nav-link{
    border-radius:10px;
    padding:8px 14px !important;
}

.nav-link:hover{
    background:rgba(255,255,255,.15);
}

.navbar .btn{
    min-width:85px;
}

.card{
    overflow:hidden;
}

.card img{
    transition:0.4s;
}

.card:hover img{
    transform:scale(1.05);
}

.card-title{
    min-height:60px;
}

.badge{
    font-size:14px;
    padding:8px 12px;
    border-radius:20px;
}

.card-footer .btn{
    flex:1;
    margin:0 4px;
}

.form-control{
    border-radius:15px;
    padding:12px 15px;
    border:1px solid #dcdcdc;
    transition:.3s;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 10px rgba(37,99,235,.2);
}

.form-label{
    font-weight:600;
    margin-bottom:8px;
}

.card{
    animation:fade .5s ease;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
.form-control{
    width:100%;
    height:48px;
}
.search-box{
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:60px;
    padding:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    transition:.35s;
    border:2px solid transparent;
}

.search-box:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(0,0,0,.18);
}

.search-box:focus-within{
    border-color:#0d6efd;
    box-shadow:0 0 0 6px rgba(13,110,253,.15);
}

.search-icon{
    color:#0d6efd;
    font-size:22px;
    padding:0 15px;
}

.search-input{
    flex:1;
    border:none;
    outline:none;
    font-size:17px;
    background:transparent;
    padding:12px;
}

.search-input::placeholder{
    color:#999;
}

.search-btn{
    border:none;
    background:linear-gradient(135deg,#0d6efd,#3b82f6);
    color:#fff;
    border-radius:40px;
    padding:12px 28px;
    font-weight:600;
    transition:.3s;
}

.search-btn:hover{
    transform:scale(1.05);
    box-shadow:0 8px 20px rgba(13,110,253,.35);
}

.clear-btn{
    color:#888;
    text-decoration:none;
    margin-left:10px;
    transition:.3s;
}

.clear-btn:hover{
    color:red;
    transform:rotate(90deg);
}

@media(max-width:768px){

    .search-box{
        flex-wrap:wrap;
        border-radius:25px;
    }

    .search-btn{
        width:100%;
        margin-top:10px;
    }

}


    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
     کتابخانه من
   </a>

<button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
</button>

        <div class="collapse navbar-collapse" id="navbarNav">

    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'home' %}">
                🏠 خانه
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="{% url 'add_book' %}">
                ➕ افزودن کتاب
            </a>
        </li>
    </ul>

    <ul class="navbar-nav ms-auto">

        {% if user.is_authenticated %}

        <li class="nav-item">
            <span class="navbar-text me-2">
                👤 {{ user.username }}
            </span>
        </li>

        <li class="nav-item">
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-danger btn-sm">
                    خروج
                </button>
            </form>
        </li>

        {% else %}

        <li class="nav-item">
            <a href="{% url 'login' %}" class="btn btn-primary btn-sm">
                ورود
            </a>
        </li>

        {% endif %}

    </ul>

</div>



    </div>
</nav>

<div class="container mt-5">

    {% block content %}

    {% endblock %}

</div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
