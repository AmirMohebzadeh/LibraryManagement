{% extends 'base.html' %}


{% block title %}
ویرایش کتاب
{% endblock %}



{% block content %}


<div class="row justify-content-center">

<div class="col-md-6">


<div class="card p-4">


<h2 class="text-center text-warning mb-4">
✏️ ویرایش کتاب
</h2>


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


{% for field in form %}

<div class="mb-3">

<label class="form-label fw-bold">
{{ field.label }}
</label>

{{ field }}

{% if field.errors %}
<div class="text-danger">
{{ field.errors }}
</div>
{% endif %}

</div>

{% endfor %}


<button class="btn btn-warning w-100 mt-3">
💾 ذخیره تغییرات
</button>


</form>


</div>


</div>

</div>


{% endblock %}
